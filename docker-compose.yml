services:
  apache_server:
    build: ./apache_server
    container_name: apache_server
    ports:
      - "2222:22"
      - "8080:80"
    networks:
      red_privada:
        ipv4_address: 172.20.0.11
    red_publica:
        ipv4_address: 213.100.100.2
    volumes:
      - ./apache_server/web:/var/www/html

 mysql_server:
    build: ./mysql_server
    container_name: mysql_server
    ports:
      - "3306:3306"
      - "2223:22"
    networks:
      red_privada:
        ipv4_address: 172.20.0.12
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  dns_server:
    build: ./dns_server
    container_name: dns_server
    ports:
      - "2224:22"
    networks:
      red_privada:
        ipv4_address: 172.20.0.10

  mail_server:
    build: ./mail_server
    container_name: mail_server
    hostname: mail_server
    domainname: masterciberseguridad.com
    ports:
      - "25:25"       # SMTP
      - "143:143"     # IMAP
      - "587:587"     # Submission (SMTP with auth)
    volumes:
      - ./maildata/mail:/var/mail
      - ./maildata/state:/var/mail-state
      - ./maildata/log:/var/log/mail
      - ./maildata/config:/tmp/docker-mailserver
      - ./sendmail.php:/var/www/html/sendmail.php
      - ./msmtprc:/etc/msmtprc   # Configuración SMTP
    environment:
      - ENABLE_SPAMASSASSIN=1
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - DMS_DEBUG=0
      - PERMIT_DOCKER=network
    networks:
      red_privada:
        ipv4_address: 172.20.0.13
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    restart: always

  proxy_server:
    build: ./proxy_server
    container_name: proxy_server
    ports:
      - "3128:3128"
      - "2226:22"
    networks:
      red_privada:
        ipv4_address: 172.20.0.14

  grafana_server:
    build: ./grafana_server
    container_name: grafana_server
    ports:
      - "3000:3000"
    networks:
      red_privada:
        ipv4_address: 172.20.0.15

  user:
    build: ./user
    container_name: user
    ports:
      - "6080:80"
    networks:
      red_privada:
        ipv4_address: 172.20.0.100
    dns:
      - 172.20.0.10
    volumes:
      - ./user/home:/root

    router:
    image: alpine
    command: >
      sh -c "
      apk add iptables;
      echo 1 > /proc/sys/net/ipv4/ip_forward;
      # NAT para la red privada
      iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;
      # Redirigir tráfico público al servidor web
      iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 80 -j DNAT --to 192.168.100.2:80;
      tail -f /dev/null
      "
      networks:
        red_privada:
          ipv4_address: 172.20.0.1  # Gateway de la red privada
        red_publica:
          ipv4_address: 213.100.100.20
        ports:
          - "80:80"
        cat_add:
          - NET_ADMIN
  attacker:
    build: ./attacker
    container_name: attacker
    stdin_open: true
    tty: true
    ports:
      - "2227:22"
    networks:
      red_ataque:
        ipv4_address: 10.20.30.10 
      red_publica:
        ipv4_address: 213.100.100.30

networks:
  red_privada:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
  red_ataque:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
  red_publica:
    driver: bridge
    ipam:
      config:
        - subnet: 213.100.100.0/24
volumes:
  user_home:
